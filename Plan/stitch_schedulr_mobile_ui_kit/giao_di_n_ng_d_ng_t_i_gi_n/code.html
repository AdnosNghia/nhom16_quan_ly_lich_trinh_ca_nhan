<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cài đặt Giao diện - Schedulr</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "inverse-surface": "#302f39",
                    "background-light": "#F8F9FA",
                    "surface-variant": "#e4e1ee",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#c4c0ff",
                    "on-surface": "#1b1b24",
                    "on-primary": "#ffffff",
                    "background": "#fcf8ff",
                    "primary-dark-accent": "#7B74FF",
                    "on-surface-variant": "#464555",
                    "on-background": "#1b1b24",
                    "surface-light": "#FFFFFF",
                    "on-secondary-fixed": "#400012",
                    "surface-tint": "#4f44e2",
                    "primary-container": "#675df9",
                    "surface-dark": "#1E1E2E",
                    "tertiary-fixed": "#ffdcc6",
                    "background-dark": "#121212",
                    "primary": "#4d41df",
                    "inverse-primary": "#c4c0ff",
                    "text-primary-light": "#1A1A2E",
                    "on-tertiary-fixed-variant": "#713700",
                    "surface-bright": "#fcf8ff",
                    "on-secondary": "#ffffff",
                    "primary-fixed": "#e3dfff",
                    "on-primary-fixed": "#100069",
                    "on-tertiary-container": "#fffbff",
                    "tertiary-fixed-dim": "#ffb785",
                    "outline": "#777587",
                    "surface-container-low": "#f6f2ff",
                    "on-primary-container": "#fffbff",
                    "tertiary-container": "#b65c00",
                    "error-container": "#ffdad6",
                    "surface": "#fcf8ff",
                    "surface-container-high": "#eae6f3",
                    "text-secondary-light": "#6C757D",
                    "outline-variant": "#c7c4d8",
                    "tertiary": "#914800",
                    "inverse-on-surface": "#f3effc",
                    "on-secondary-fixed-variant": "#8f0935",
                    "secondary-fixed": "#ffd9dd",
                    "on-error": "#ffffff",
                    "surface-dim": "#dcd8e5",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#f0ecf9",
                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#670023",
                    "secondary-container": "#fd6483",
                    "secondary-fixed-dim": "#ffb2bc",
                    "surface-container-highest": "#e4e1ee",
                    "on-primary-fixed-variant": "#3622ca",
                    "secondary": "#b0284b",
                    "on-tertiary-fixed": "#301400",
                    "text-primary-dark": "#E8E8F0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "16px",
                    "xxl": "48px",
                    "sm": "8px",
                    "xs": "4px",
                    "md": "16px",
                    "base": "4px",
                    "lg": "24px",
                    "xl": "32px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "label-sm": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-md": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background-dark sticky top-0 z-50">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Giao diện</h1>
</div>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-[20px]" data-icon="account_circle">account_circle</span>
</div>
</div>
</div>
</header>
<main class="max-w-screen-xl mx-auto px-margin-mobile pt-lg">
<div class="grid-cols-1 lg:grid-cols-12 gap-lg">
<!-- Theme Mode Selection Section -->
<section class="space-y-lg max-w-3xl mx-auto">
<div class="space-y-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Chế độ hiển thị</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Chọn cách Schedulr hiển thị trên thiết bị của bạn.</p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-md"><!-- Light Mode Card -->
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-2xl bg-surface-container border-2 border-primary shadow-sm group hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined text-primary text-3xl">light_mode</span>
<span class="font-label-sm text-label-sm font-bold text-primary">Sáng</span>
<div class="absolute top-2 right-2 w-5 h-5 bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Dark Mode Card -->
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-2xl bg-surface-container-lowest border-2 border-transparent hover:border-outline-variant group hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">dark_mode</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface">Tối</span>
</button>
<!-- System Mode Card -->
<button class="flex flex-col items-center justify-center gap-2 p-6 rounded-2xl bg-surface-container-lowest border-2 border-transparent hover:border-outline-variant group hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">brightness_auto</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface">Hệ thống</span>
</button></div>
<!-- Primary Color Selection -->
<div class="space-y-sm pt-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Màu chủ đạo</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Cá nhân hóa ứng dụng với màu sắc yêu thích của bạn.</p>
</div>
<div class="flex flex-wrap gap-4 p-lg bg-surface-container-low rounded-2xl">
<!-- Color Swatches -->
<button class="w-12 h-12 rounded-full bg-primary ring-4 ring-primary/20 ring-offset-2 flex items-center justify-center shadow-lg transform scale-110">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<button class="w-12 h-12 rounded-full bg-[#E91E63] hover:ring-2 hover:ring-[#E91E63]/40 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-[#009688] hover:ring-2 hover:ring-[#009688]/40 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-[#FF9800] hover:ring-2 hover:ring-[#FF9800]/40 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-[#607D8B] hover:ring-2 hover:ring-[#607D8B]/40 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-[#673AB7] hover:ring-2 hover:ring-[#673AB7]/40 transition-all"></button>
<button class="w-12 h-12 rounded-full border-2 border-dashed border-outline-variant flex items-center justify-center text-outline group hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined">palette</span>
</button>
</div>
<div class="pt-xl">
<button class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-95 transition-all">
    Áp dụng thay đổi
  </button>
</div></section>
<!-- Preview Section (Asymmetric / Bento) -->
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container-lowest dark:bg-surface-dark shadow-[0_-4px_8px_rgba(0,0,0,0.05)] rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container-high dark:hover:bg-inverse-surface transition-all" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container-high dark:hover:bg-inverse-surface transition-all" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span class="font-label-sm text-label-sm">Calendar</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container-high dark:hover:bg-inverse-surface transition-all" href="#">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-label-sm text-label-sm">Tasks</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-3 py-1.5 hover:bg-surface-container-high dark:hover:bg-inverse-surface transition-all" href="#">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="font-label-sm text-label-sm">Stats</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-dark-accent text-on-primary-container dark:text-on-primary rounded-xl px-3 py-1.5 scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
</body></html>
