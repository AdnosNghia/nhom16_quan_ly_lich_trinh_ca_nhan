<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcf8ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .floating-label-group:focus-within label,
        .floating-label-group input:not(:placeholder-shown) + label {
            transform: translateY(-22px) scale(0.85);
            color: #4d41df;
        }
        .input-transition {
            transition: all 0.2s ease-in-out;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed-variant": "#8f0935",
                      "surface-dim": "#dcd8e5",
                      "on-tertiary-fixed": "#301400",
                      "on-primary-container": "#fffbff",
                      "surface-light": "#FFFFFF",
                      "surface-tint": "#4f44e2",
                      "text-primary-light": "#1A1A2E",
                      "surface-container-high": "#eae6f3",
                      "on-secondary-fixed": "#400012",
                      "error-container": "#ffdad6",
                      "primary-dark-accent": "#7B74FF",
                      "on-secondary": "#ffffff",
                      "primary-fixed-dim": "#c4c0ff",
                      "inverse-on-surface": "#f3effc",
                      "tertiary-container": "#b65c00",
                      "tertiary": "#914800",
                      "surface-container-highest": "#e4e1ee",
                      "secondary-fixed-dim": "#ffb2bc",
                      "inverse-primary": "#c4c0ff",
                      "inverse-surface": "#302f39",
                      "on-primary-fixed-variant": "#3622ca",
                      "secondary-container": "#fd6483",
                      "surface-container-lowest": "#ffffff",
                      "outline": "#777587",
                      "on-error": "#ffffff",
                      "on-background": "#1b1b24",
                      "background-light": "#F8F9FA",
                      "on-surface": "#1b1b24",
                      "primary-container": "#675df9",
                      "on-tertiary-fixed-variant": "#713700",
                      "on-error-container": "#93000a",
                      "on-primary": "#ffffff",
                      "surface-dark": "#1E1E2E",
                      "text-secondary-light": "#6C757D",
                      "surface-bright": "#fcf8ff",
                      "on-tertiary": "#ffffff",
                      "background-dark": "#121212",
                      "surface-variant": "#e4e1ee",
                      "surface": "#fcf8ff",
                      "text-primary-dark": "#E8E8F0",
                      "surface-container": "#f0ecf9",
                      "tertiary-fixed": "#ffdcc6",
                      "secondary": "#b0284b",
                      "on-tertiary-container": "#fffbff",
                      "tertiary-fixed-dim": "#ffb785",
                      "primary": "#4d41df",
                      "on-surface-variant": "#464555",
                      "surface-container-low": "#f6f2ff",
                      "outline-variant": "#c7c4d8",
                      "error": "#ba1a1a",
                      "secondary-fixed": "#ffd9dd",
                      "on-primary-fixed": "#100069",
                      "primary-fixed": "#e3dfff",
                      "background": "#fcf8ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "32px",
                      "gutter": "16px",
                      "md": "16px",
                      "sm": "8px",
                      "xxl": "48px",
                      "base": "4px",
                      "xs": "4px",
                      "margin-mobile": "16px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "headline-md": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "body-md": ["Plus Jakarta Sans"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "label-sm": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Auth Shell Suppression: No TopAppBar or BottomNavBar as this is a focused transactional screen -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 shadow-[0_8px_32px_rgba(77,65,223,0.08)] flex flex-col gap-8 border border-surface-variant">
<!-- Header Section -->
<header class="text-center flex flex-col items-center gap-2">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-2 shadow-sm">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-weight="fill">calendar_month</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Schedulr</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lên kế hoạch mỗi ngày, đơn giản hóa cuộc sống</p>
</header>
<!-- Social Register -->
<section class="flex flex-col gap-4">
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-surface-light border border-outline-variant rounded-lg font-headline-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors duration-150 active:scale-95">
<img alt="Google Icon" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCek4QenDDpeLfPU_6E_iebJQ8a6fRMYkIGDpzUOT6UjXHhHKXLnPRBrmoE0WULTB30iVzsAI6xtSg8gnn7MCd8NzdsW3EjG7UIr96DDDLQPEzgU5k597UU996NSupW63hMb5X1cESpeJ3m8pm0mGKHQbSYwJqyJ8AHZa2kWxA6GeQcT0BGdpUNihstlgzchgNpMtGEtKXCakckaEerxH0w4JoLcFc2xcrKO-vTcpjExHUpMSNf_76Dyr5yjhn-nrXlDgH4ON6jdWk"/>
<span>Đăng ký với Google</span>
</button>
<div class="flex items-center gap-4">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">HOẶC</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
</section>
<!-- Registration Form -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<div class="flex flex-col gap-5">
<!-- Name Field -->
<div class="floating-label-group relative">
<input class="peer w-full h-12 pt-4 px-3 bg-surface-container-low border-b-2 border-transparent border-surface-variant focus:border-primary focus:ring-0 rounded-t-lg font-body-md text-on-surface input-transition" id="full_name" name="full_name" placeholder=" " type="text"/>
<label class="absolute left-3 top-4 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="full_name">Họ và tên</label>
</div>
<!-- Email Field -->
<div class="floating-label-group relative">
<input class="peer w-full h-12 pt-4 px-3 bg-surface-container-low border-b-2 border-transparent border-surface-variant focus:border-primary focus:ring-0 rounded-t-lg font-body-md text-on-surface input-transition" id="email" name="email" placeholder=" " type="email"/>
<label class="absolute left-3 top-4 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="email">Địa chỉ Email</label>
</div>
<!-- Password Field -->
<div class="floating-label-group relative">
<input class="peer w-full h-12 pt-4 px-3 bg-surface-container-low border-b-2 border-transparent border-surface-variant focus:border-primary focus:ring-0 rounded-t-lg font-body-md text-on-surface input-transition" id="password" name="password" placeholder=" " type="password"/>
<label class="absolute left-3 top-4 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="password">Mật khẩu</label>
<span class="material-symbols-outlined absolute right-3 top-3 text-outline cursor-pointer hover:text-primary transition-colors">visibility</span>
</div>
<!-- Confirm Password Field -->
<div class="floating-label-group relative">
<input class="peer w-full h-12 pt-4 px-3 bg-surface-container-low border-b-2 border-transparent border-surface-variant focus:border-primary focus:ring-0 rounded-t-lg font-body-md text-on-surface input-transition" id="confirm_password" name="confirm_password" placeholder=" " type="password"/>
<label class="absolute left-3 top-4 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="confirm_password">Xác nhận mật khẩu</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary py-4 rounded-xl font-headline-md text-on-primary shadow-lg shadow-primary/20 hover:bg-primary-container transition-all duration-150 active:scale-95 flex items-center justify-center gap-2" type="submit">
<span>Đăng ký</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<footer class="text-center pt-2">
<p class="font-body-md text-body-md text-on-surface-variant">
                Đã có tài khoản? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Đăng nhập</a>
</p>
</footer>
</main>
<!-- Background Decoration (Subtle modern aesthetics) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary opacity-[0.03] rounded-full blur-[100px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary opacity-[0.03] rounded-full blur-[100px]"></div>
</div>
</body></html>
