<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e1ee;
            border-radius: 10px;
        }

                      "on-tertiary-container": "#fffbff",
                      "tertiary-fixed-dim": "#ffb785",
                      "outline": "#777587",
                      "surface-container-low": "#f6f2ff",

                      "tertiary-container": "#b65c00",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen pb-xxl">
<!-- Header / TopAppBar (As per JSON configuration guidance) -->
<header class="sticky top-0 z-50 bg-background dark:bg-background-dark h-16 w-full flex justify-between items-center px-margin-mobile max-w-screen-xl mx-auto">
<div class="flex items-center gap-md">
<button aria-label="Đóng" class="material-symbols-outlined text-on-surface hover:bg-surface-container-low transition-colors p-base rounded-full">close</button>
<h1 class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed-dim">Thêm Sự Kiện</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline-variant">more_vert</span>
</div>
</header>
<main class="max-w-2xl mx-auto px-margin-mobile pt-md space-y-lg">
<!-- Large Title Input -->
<section class="space-y-xs">
<input autofocus="" class="w-full bg-transparent border-none focus:ring-0 font-headline-lg text-[32px] font-extrabold placeholder:text-outline-variant text-primary" placeholder="Tên sự kiện của bạn..." type="text"/>
</section>
<!-- Date & Time Selection (Bento-like cards) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0_4px_8px_rgba(0,0,0,0.05)] border border-surface-variant flex flex-col justify-between hover:bg-surface-container-low transition-all">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant">Bắt đầu</span>
<span class="material-symbols-outlined text-primary text-[20px]">event</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md">15 Tháng 10, 2023</span>
<span class="font-body-md text-body-md text-on-surface-variant">09:00 AM</span>
</div>
</div>
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0_4px_8px_rgba(0,0,0,0.05)] border border-surface-variant flex flex-col justify-between hover:bg-surface-container-low transition-all">
<div class="flex items-center justify-between mb-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant">Kết thúc</span>
<span class="material-symbols-outlined text-primary text-[20px]">schedule</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md">15 Tháng 10, 2023</span>
<span class="font-body-md text-body-md text-on-surface-variant">10:30 AM</span>
</div>
</div>
</section>
<!-- All Day Toggle -->
<section class="flex items-center justify-between bg-surface-container-low p-md rounded-xl">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant">check_circle</span>
<span class="font-body-md text-body-md font-semibold">Cả ngày</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</section>
<!-- Category Selection -->
<section class="space-y-md">
<h2 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold">Danh mục</h2>
<div class="flex flex-wrap gap-sm">
<button class="flex items-center gap-xs px-lg py-sm bg-primary-container text-on-primary-container rounded-full border-2 border-primary transition-all">
<span class="w-3 h-3 rounded-full bg-on-primary-container"></span>
<span class="font-label-sm text-label-sm font-bold">Công việc</span>
</button>
<button class="flex items-center gap-xs px-lg py-sm bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-full border-2 border-transparent hover:border-tertiary transition-all">
<span class="w-3 h-3 rounded-full bg-tertiary"></span>
<span class="font-label-sm text-label-sm font-bold">Học tập</span>
</button>
<button class="flex items-center gap-xs px-lg py-sm bg-secondary-fixed text-on-secondary-fixed-variant rounded-full border-2 border-transparent hover:border-secondary transition-all">
<span class="w-3 h-3 rounded-full bg-secondary"></span>
<span class="font-label-sm text-label-sm font-bold">Cá nhân</span>
</button>
</div>
</section>
<!-- Reminders -->
<section class="space-y-md">
<h2 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold">Nhắc nhở</h2>
<div class="flex gap-sm">
<button class="flex-1 py-sm bg-surface-container rounded-lg font-body-md text-body-md hover:bg-primary-container hover:text-on-primary-container transition-all">5 phút</button>
<button class="flex-1 py-sm bg-primary-container text-on-primary-container rounded-lg font-body-md text-body-md transition-all font-bold shadow-sm">15 phút</button>
<button class="flex-1 py-sm bg-surface-container rounded-lg font-body-md text-body-md hover:bg-primary-container hover:text-on-primary-container transition-all">30 phút</button>
</div>
</section>
<!-- Task Checklist (Asymmetric Layout) -->
<section class="space-y-md">
<div class="flex items-center justify-between">
<h2 class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-bold">Công việc con</h2>
<button class="text-primary font-label-sm text-label-sm font-bold flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Thêm việc
                </button>
</div>
<div class="space-y-sm">
<div class="flex items-center gap-md p-md bg-white rounded-xl border border-surface-variant group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md flex-grow">Chuẩn bị tài liệu họp</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 cursor-pointer">drag_indicator</span>
</div>
<div class="flex items-center gap-md p-md bg-white rounded-xl border border-surface-variant group">
<input checked="" class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-md text-body-md flex-grow line-through text-on-surface-variant">Gửi email mời tham gia</span>
<span class="material-symbols-outlined text-outline-variant opacity-0 group-hover:opacity-100 cursor-pointer">drag_indicator</span>
</div>
<div class="flex items-center gap-md p-md bg-white rounded-xl border border-surface-variant group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<input class="bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md w-full" placeholder="Thêm công việc khác..." type="text"/>
</div>
</div>
</section>
<!-- Illustration / Visual Anchor -->
<section class="py-md">
<div class="relative h-48 rounded-2xl overflow-hidden shadow-lg group">
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent z-10"></div>
<img alt="Calendar concept" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" data-alt="A clean, minimalist workspace scene featuring a digital tablet showing a calendar interface next to a steaming cup of coffee. The lighting is soft morning sunlight filtering through a window, creating a serene and productive atmosphere. The color palette consists of soft lavenders, crisp whites, and deep indigo accents, perfectly matching the modern corporate aesthetic. High-key lighting highlights textures of wood and paper." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOw20Tx_A6N7vydPFsU8DXZKSazhgF8DGK8AOyAqEBAiy5zUPlyCAb0ccFWOznT8A_iEMHx2lnXcHKxy1y5Cnc2QuTR2ONqhtFc_39CNQlFoEnYxCvs2fPo7MtfRk6-AcgvyYv1Hirqdyqx0vKn84J2p9yESRz4T8XieKTQ67f5Fma0V91o8G1v3w-pgNNqpLpzmV7VN19F2XjgMZMjLWjwPSKhgaDBs5Cti52b1zVrY8bltSXeu67J-E_EoLyQ1M-rDeUxRkitko"/>
<div class="absolute bottom-md left-md z-20">
<p class="text-white font-headline-md text-headline-md">Sắp xếp ngày mới</p>
<p class="text-white/80 font-body-md text-body-md">Đảm bảo bạn không bỏ lỡ điều gì.</p>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Save Button (Floating-like logic) -->
<footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md px-margin-mobile py-md flex justify-center items-center z-50">
<button class="w-full max-w-2xl bg-primary text-on-primary font-headline-md text-headline-md py-md rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-md">
<span class="material-symbols-outlined" data-weight="fill">save</span>
            Lưu Sự Kiện
        </button>
</footer>
</body></html>
