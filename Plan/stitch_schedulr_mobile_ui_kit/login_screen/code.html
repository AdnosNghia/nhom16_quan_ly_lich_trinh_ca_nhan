<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Floating Label Logic */
        .peer:focus ~ label,
        .peer:not(:placeholder-shown) ~ label {
            transform: translateY(-1.25rem) scale(0.85);
            color: #4d41df;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#302f39",
                        "inverse-primary": "#c4c0ff",
                        "secondary-fixed": "#ffd9dd",
                        "surface-dark": "#1E1E2E",
                        "primary-dark-accent": "#7B74FF",
                        "background": "#fcf8ff",
                        "secondary": "#b0284b",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f0ecf9",
                        "on-secondary-fixed-variant": "#8f0935",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary": "#914800",
                        "surface-dim": "#dcd8e5",
                        "on-background": "#1b1b24",
                        "on-primary-fixed": "#100069",
                        "on-tertiary-fixed-variant": "#713700",
                        "primary-container": "#675df9",
                        "on-surface": "#1b1b24",
                        "secondary-fixed-dim": "#ffb2bc",
                        "background-light": "#F8F9FA",
                        "primary-fixed": "#e3dfff",
                        "surface-container-highest": "#e4e1ee",
                        "surface-variant": "#e4e1ee",
                        "surface-tint": "#4f44e2",
                        "surface": "#fcf8ff",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary-fixed": "#301400",
                        "tertiary-fixed-dim": "#ffb785",
                        "text-primary-dark": "#E8E8F0",
                        "primary-fixed-dim": "#c4c0ff",
                        "on-primary-container": "#fffbff",
                        "text-secondary-light": "#6C757D",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#eae6f3",
                        "tertiary-container": "#b65c00",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdcc6",
                        "outline": "#777587",
                        "text-primary-light": "#1A1A2E",
                        "on-surface-variant": "#464555",
                        "secondary-container": "#fd6483",
                        "surface-bright": "#fcf8ff",
                        "primary": "#4d41df",
                        "inverse-on-surface": "#f3effc",
                        "surface-container-low": "#f6f2ff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#400012",
                        "on-secondary-container": "#670023",
                        "surface-light": "#FFFFFF",
                        "on-primary-fixed-variant": "#3622ca",
                        "outline-variant": "#c7c4d8",
                        "background-dark": "#121212"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter": "16px",
                        "xs": "4px",
                        "xxl": "48px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "xl": "32px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                },
            },
        }

<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.05)] p-xl border border-outline-variant/30">
<!-- Header Branding -->
<header class="flex flex-col items-center mb-xl text-center">
<div class="mb-md flex items-center gap-sm">
<div class="w-12 h-12 bg-primary flex items-center justify-center rounded-xl shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-[28px]" data-icon="calendar_today">calendar_today</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Schedulr</h1>
</div>
<p class="font-body-md text-on-surface-variant max-w-[280px]">Lên kế hoạch mỗi ngày, đơn giản hóa cuộc sống</p>
</header>
<!-- Auth Actions -->
<section class="space-y-lg">
<!-- Social Sign In -->
<button class="w-full h-12 flex items-center justify-center gap-md bg-surface-container-low border border-outline-variant hover:bg-surface-container transition-all rounded-lg group active:scale-[0.98]">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3-IuMjIZ0lPGo0dB-iqRminCS8QgI_pyouK0PDSlGfUSNjDu1waWnLuIRTH40_z31nhwO7e3VFm-N5q0-1UAOPWvAt5Hd1ObNY_-bAru7KIIF4G0sYdeve_dIW7UaEffr8LyMoRG0xyBz3T6s8N1It5za7o7OVyRbixQuF0FnSH2XqnlAK5ysAZrLrfTwW8wuNABjv0734hhF1ViM7w-cAN8bku7qnuwA840IdE4xb7_5Oc_zMfaQYA5GmVXZsEUbQ00ufHUTDFc"/>
<span class="font-headline-md text-body-md text-on-surface">Tiếp tục với Google</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">HOẶC</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Email & Password Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="relative">
<input class="peer w-full h-12 px-md pt-4 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary outline-none transition-all rounded-t-lg font-body-md text-on-surface placeholder-transparent" id="email" name="email" placeholder=" " type="email"/>
<label class="absolute left-md top-3.5 font-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="email">Địa chỉ Email</label>
</div>
<!-- Password Field -->
<div class="relative">
<input class="peer w-full h-12 px-md pt-4 bg-surface-container-low border-b-2 border-outline-variant focus:border-primary outline-none transition-all rounded-t-lg font-body-md text-on-surface placeholder-transparent" id="password" name="password" placeholder=" " type="password"/>
<label class="absolute left-md top-3.5 font-body-md text-on-surface-variant transition-all pointer-events-none origin-left" for="password">Mật khẩu</label>
<button class="absolute right-md top-3 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Action Buttons -->
<div class="pt-sm space-y-md">
<button class="w-full h-12 bg-primary text-on-primary font-headline-md text-body-md rounded-lg shadow-md shadow-primary/30 hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
                        Đăng nhập
                    </button>
<div class="text-center">
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Quên mật khẩu?</a>
</div>
</div>
</form>
</section>
<!-- Footer -->
<footer class="mt-xl text-center border-t border-outline-variant/30 pt-lg">
<p class="font-body-md text-on-surface-variant">
                Chưa có tài khoản? 
                <a class="font-headline-md text-body-md text-secondary font-bold hover:text-secondary-container transition-colors ml-1" href="#">Đăng ký</a>
</p>
</footer>
</main>
<!-- Aesthetic Decorative Background Elements -->
<div class="fixed top-0 left-0 -z-10 w-full h-full overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<!-- Background Context Illustration (Detailed Prompt) -->
<div class="hidden lg:block fixed right-xl bottom-xl max-w-sm">
<img class="w-full h-auto opacity-80" data-alt="A clean, minimalist 3D isometric illustration of a stylized digital planner on a white desk. The scene is bathed in soft, high-key morning light, creating a professional and calm atmosphere. The primary color palette features sophisticated shades of indigo-purple and soft coral accents. Floating translucent UI elements like checkmarks and calendar dots surround the planner, emphasizing productivity and organization. The style is modern corporate minimalism with a high-end, artistic feel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3-IuMjIZ0lPGo0dB-iqRminCS8QgI_pyouK0PDSlGfUSNjDu1waWnLuIRTH40_z31nhwO7e3VFm-N5q0-1UAOPWvAt5Hd1ObNY_-bAru7KIIF4G0sYdeve_dIW7UaEffr8LyMoRG0xyBz3T6s8N1It5za7o7OVyRbixQuF0FnSH2XqnlAK5ysAZrLrfTwW8wuNABjv0734hhF1ViM7w-cAN8bku7qnuwA840IdE4xb7_5Oc_zMfaQYA5GmVXZsEUbQ00ufHUTDFc"/>
</div>
</body></html>
